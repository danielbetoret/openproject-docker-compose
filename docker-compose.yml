networks:
  frontend:
  backend:
  public:
    external: true
    name: ${DOCKER_PUBLIC_NETWORK}

volumes:
  pgdata:
    external: true
    name: ${DOCKER_STACK_NAME}_db_data
  opdata:
    external: true
    name: ${DOCKER_STACK_NAME}_openproject_data

x-op-deploy-specification: &deploy_specification
  deploy:
    mode: replicated
    replicas: 1
    restart_policy:
      condition: any
    resources:
      limits:
        cpus: '0.1'
x-op-image: &image
  image: openproject/openproject:${TAG:-16-slim}
x-op-app: &app
  <<: [*image, *deploy_specification]
  environment:
    OPENPROJECT_HTTPS: "${OPENPROJECT_HTTPS:-true}"
    OPENPROJECT_HOST__NAME: "${OPENPROJECT_HOST__NAME:-localhost:8080}"
    OPENPROJECT_HSTS: "${OPENPROJECT_HSTS:-true}"
    RAILS_CACHE_STORE: "memcache"
    OPENPROJECT_CACHE__MEMCACHE__SERVER: "cache:11211"
    OPENPROJECT_RAILS__RELATIVE__URL__ROOT: "${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}"
    DATABASE_URL: "${DATABASE_URL:-postgres://postgres:p4ssw0rd@db/openproject?pool=20&encoding=unicode&reconnect=true}"
    RAILS_MIN_THREADS: ${RAILS_MIN_THREADS:-4}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
    # set to true to enable the email receiving feature. See ./docker/cron for more options
    IMAP_ENABLED: "${IMAP_ENABLED:-false}"
  volumes:
    - "opdata:/var/openproject/assets"

services:
  db:
    image: postgres:13
    <<: *deploy_specification
    stop_grace_period: "3s"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-p4ssw0rd}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.3'

  cache:
    image: memcached
    <<: *deploy_specification
    networks:
      - backend

  proxy:
    image: ${DOCKER_STACK_NAME}_proxy
    <<: *deploy_specification
    depends_on:
      - web
    networks:
      - frontend

  web:
    <<: *app
    command: "./docker/prod/web"
    networks:
      - frontend
      - backend
      - public
    ports:
      - 8081:8080
    depends_on:
      - db
      - cache
      - seeder
    labels:
      - autoheal=true
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080${OPENPROJECT_RAILS__RELATIVE__URL__ROOT:-}/health_checks/default"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.3'
      labels:
        # traefik config
        - 'traefik.enable=true'
        - 'traefik.http.routers.${DOCKER_STACK_NAME}_web.rule=Host(`$HOST`)'
        - 'traefik.http.services.${DOCKER_STACK_NAME}_web.loadbalancer.server.port=8080'
        - 'traefik.http.routers.${DOCKER_STACK_NAME}_web.entrypoints=websecure'
        - 'traefik.http.routers.${DOCKER_STACK_NAME}_web.tls=true'
        - 'traefik.http.routers.${DOCKER_STACK_NAME}_web.tls.certresolver=leresolver'

  autoheal:
    image: willfarrell/autoheal:1.2.0
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_START_PERIOD: 600
      AUTOHEAL_INTERVAL: 30

  worker:
    <<: *app
    command: "./docker/prod/worker"
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder

  cron:
    <<: *app
    command: "./docker/prod/cron"
    networks:
      - backend
    depends_on:
      - db
      - cache
      - seeder

  seeder:
    <<: *app
    command: "./docker/prod/seeder"
    networks:
      - backend
    deploy:
      restart_policy:
        condition: on-failure
